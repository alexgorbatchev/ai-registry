approval_policy = "never"
sandbox_mode = "danger-full-access"
# model_auto_compact_token_limit = 150000
# model_auto_compact_token_limit_scope = "total"
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
service_tier = "default"
model_auto_compact_token_limit = 150000
model_auto_compact_token_limit_scope = "total"
shell_environment_policy.inherit = "core"

[desktop]
external-agent-import-sync-enabled = false
followUpQueueMode = "steer"
external-agent-import-sync-item-types = "all"
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true
selected-avatar-id = "stacky"

[tui]
status_line = [
  "thread-name",
  "model-with-reasoning",
  "current-dir",
  "context-window-size",
  "five-hour-limit",
  "weekly-limit",
  "used-tokens",
]
status_line_use_colors = true
session_picker_view = "comfortable"
screen_reader_detection_done = true

[shell_environment_policy.set]
AGENT = "1"
CLAUDE_CODE_MAX_CONTEXT_TOKENS = "1000000"

[features]
goals = true

# Untrusted hooks do not run: approve these once per machine with /hooks.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bun "$HOME/.claude/hooks/guardGitBypass.ts"'

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'bun "$HOME/.claude/hooks/recapTitle.ts"'
timeout = 10

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'bun "$HOME/.claude/hooks/turnNotification.ts" codex'
timeout = 10

[marketplaces]
alexgorbatchev = { source_type = "git", source = "https://github.com/alexgorbatchev/claude-workspace.git" }

[plugins]
"documents@openai-primary-runtime" = { enabled = true }
"pdf@openai-primary-runtime" = { enabled = true }
"spreadsheets@openai-primary-runtime" = { enabled = true }
"presentations@openai-primary-runtime" = { enabled = true }
"template-creator@openai-primary-runtime" = { enabled = true }
"claude-workspace@alexgorbatchev" = { enabled = true }
"codex-app-tools@openai-bundled" = { enabled = true }
"browser@openai-bundled" = { enabled = true }
"unified-computer-use@openai-bundled" = { enabled = true }
"chrome@openai-bundled" = { enabled = true }
"visualize@openai-bundled" = { enabled = true }
"computer-use@openai-bundled" = { enabled = true }

[mcp_servers.node_repl.env]
NODE_REPL_TRUSTED_SERVICES = '{"sky":"@oai/sky/service"}'

[apps]
connector_openai_codex_document_control = { enabled = false }

