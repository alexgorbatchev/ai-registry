<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans, system-ui, sans-serif); color: var(--foreground, #e5e5e5); }
  svg { width: 100%; height: auto; display: block; }
  .lane { stroke: var(--border, #3a3a3a); stroke-dasharray: 3 4; }
  .actor rect { fill: var(--card, #1c1c1c); stroke: var(--border, #3a3a3a); }
  .actor text { fill: var(--foreground, #e5e5e5); font-size: 11px; font-weight: 600; }
  .label { fill: var(--foreground, #e5e5e5); font-size: 10.5px; }
  .phase { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .divider { stroke: var(--border, #3a3a3a); }
  .note rect { fill: var(--secondary, #262626); stroke: var(--border, #3a3a3a); }
  .note text { fill: var(--foreground, #e5e5e5); font-size: 10.5px; }
</style>
</head>
<body>
<div id="diagram"></div>
<script>
// Replace DIAGRAM only. Step forms:
//   { phase: "1 · Request" }                         starts a colored section
//   { from: "web", to: "db", label: "INSERT row" }   arrow; add reply: true for a dashed response
//   { note: "web", lines: ["checks auth", "..."] }   note box centered on an actor
const DIAGRAM = {
  title: "Example flow",
  actors: [
    { id: "client", name: "client" },
    { id: "api", name: "API" },
    { id: "db", name: "database" },
  ],
  steps: [
    { phase: "1 · Request" },
    { from: "client", to: "api", label: "POST /things" },
    { note: "api", lines: ["validate input"] },
    { from: "api", to: "db", label: "INSERT thing" },
    { from: "api", to: "client", label: "201 {id}", reply: true },
  ],
};

const WIDTH = 720;
const lane = WIDTH / DIAGRAM.actors.length;
const index = Object.fromEntries(DIAGRAM.actors.map((a, i) => [a.id, i]));
const x = (id) => {
  if (!(id in index)) throw new Error(`unknown actor: ${id}`);
  return lane / 2 + index[id] * lane;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let y = 58, phase = 0, color = "var(--chart-1, #60a5fa)";
const parts = [];
for (const s of DIAGRAM.steps) {
  if (s.phase) {
    y += 10;
    color = `var(--chart-${(phase++ % 6) + 1}, #60a5fa)`;
    parts.push(`<line class="divider" x1="0" x2="${WIDTH}" y1="${y}" y2="${y}"/>` +
      `<text class="phase" x="4" y="${y + 14}" style="fill:${color}">${esc(s.phase)}</text>`);
    y += 42;
  } else if (s.note) {
    const cx = x(s.note), h = 8 + s.lines.length * 14, w = Math.min(260, WIDTH - 8);
    const left = Math.max(4, Math.min(WIDTH - w - 4, cx - w / 2));
    parts.push(`<g class="note"><rect x="${left}" y="${y - 10}" width="${w}" height="${h}" rx="5"/>` +
      s.lines.map((t, i) => `<text x="${left + w / 2}" y="${y + 5 + i * 14}" text-anchor="middle">${esc(t)}</text>`).join("") + `</g>`);
    y += h + 18;
  } else {
    const x1 = x(s.from), x2 = x(s.to), d = x2 > x1 ? 1 : -1;
    parts.push(`<text class="label" x="${(x1 + x2) / 2}" y="${y - 5}" text-anchor="middle">${esc(s.label)}</text>` +
      `<line x1="${x1}" x2="${x2 - d * 7}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="1.6"${s.reply ? ' stroke-dasharray="5 3"' : ""}/>` +
      `<path d="M${x2} ${y} l${-d * 8} -4 v8z" fill="${color}"/>`);
    y += 32;
  }
}
const height = y + 10, boxW = Math.min(112, lane - 8);
const lanes = DIAGRAM.actors.map((a) =>
  `<line class="lane" x1="${x(a.id)}" x2="${x(a.id)}" y1="36" y2="${height}"/>` +
  `<g class="actor"><rect x="${x(a.id) - boxW / 2}" y="6" width="${boxW}" height="30" rx="6"/>` +
  `<text x="${x(a.id)}" y="25" text-anchor="middle">${esc(a.name)}</text></g>`).join("");
document.getElementById("diagram").innerHTML =
  `<svg viewBox="0 0 ${WIDTH} ${height}" role="img" aria-label="${esc(DIAGRAM.title)}">${lanes}${parts.join("")}</svg>`;
</script>
</body>
</html>
